<footer id="footer" class="no-print">
    <div class="inner">
        <section>
            <a class="brand" href="/" title="{{ site.title }}"><img src="/assets/images/divd-logo.svg" alt="DIVD" width="84" height="33"><span>CSIRT</span></a>
            <p>{{ site.description }}</p>
        </section>
        <ul class="plain">
            <li><a href="https://www.divd.nl"><i class="fa fa-globe" aria-hidden="true"></i>www.divd.nl</a></li>
            <li><a href="/contact/"><i class="fa fa-envelope" aria-hidden="true"></i>Contact</a></li>
            <li><a href="https://twitter.com/DIVDnl"><i class="fa fa-twitter" aria-hidden="true"></i>Twitter</a></li>
            <li><a href="https://www.linkedin.com/company/divd-nl"><i class="fa fa-linkedin" aria-hidden="true"></i>LinkedIn</a></li>
        </ul>
    </div>
    <div class="colophon">
        <div class="inner">&copy; {{ site.time | date: "%Y" }} DIVD - Dutch Institute for Vulnerability Disclosure</div>
    </div>
</footer>
<!-- Scripts -->
<script src="assets/js/jquery.min.js"></script>
<script src="assets/js/browser.min.js"></script>
<script src="assets/js/breakpoints.min.js"></script>
<script src="assets/js/util.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/mermaid.min.js"></script>

{% if site.google_analytics %}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', '{{ site.google_analytics }}');
</script>
{% endif %}
{% if site.goatcounter %}
    <script data-goatcounter="https://{{ site.goatcounter }}.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
{% endif %}
</body>
</html>
